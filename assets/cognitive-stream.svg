<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200">
  <defs>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="boxBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashAnim {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px currentColor); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 12px currentColor); }
      }
      @keyframes packetFly {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }

      .dash-path { stroke-dasharray: 6 4; animation: dashAnim 1.2s linear infinite; }
      .box-hover { transform-origin: center; animation: nodeGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" rx="12" fill="#090d1a" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="440" y="28" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1.5">
    REAL-TIME COGNITIVE FLOW // تدفق المعالجة الإدراكية الحي
  </text>

  <!-- Connection Pipeline Paths with Animated Dashes -->
  <!-- Box 1 -> Box 2 -->
  <path d="M 165 110 L 225 110" stroke="#06d6a0" stroke-width="2" class="dash-path" />
  <polygon points="225,110 217,106 217,114" fill="#06d6a0" />

  <!-- Box 2 -> Box 3 -->
  <path d="M 375 110 L 435 110" stroke="#38bdf8" stroke-width="2" class="dash-path" />
  <polygon points="435,110 427,106 427,114" fill="#38bdf8" />

  <!-- Box 3 -> Box 4 -->
  <path d="M 585 110 L 645 110" stroke="#818cf8" stroke-width="2" class="dash-path" />
  <polygon points="645,110 637,106 637,114" fill="#818cf8" />

  <!-- Feedback Loop: Box 4 -> Box 2 (Reflection consolidation into Graph) -->
  <path d="M 715 155 L 715 178 L 300 178 L 300 155" fill="none" stroke="rgba(236, 72, 153, 0.45)" stroke-width="1.5" stroke-dasharray="5 5" class="dash-path" />
  <text x="510" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#ec4899">
    ↺ Layer 9 Reflection Loop: Post-Session Consolidation &amp; Working Memory Flush
  </text>

  <!-- BOX 1: Input & Sensory Intake -->
  <g transform="translate(25, 60)" class="box-hover">
    <rect width="140" height="95" rx="8" fill="url(#boxBg)" stroke="#06d6a0" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="rgba(6, 214, 160, 0.2)" />
    <text x="24" y="28" text-anchor="middle" font-size="12">💬</text>
    <text x="42" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06d6a0">User Stream</text>
    <text x="42" y="37" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Sensory Buffer</text>
    <line x1="12" y1="48" x2="128" y2="48" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="65" font-family="ui-monospace, monospace" font-size="9.5" fill="#f1f5f9">Arabic Prompt</text>
    <text x="14" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#94a3b8">Intent Extraction</text>
  </g>

  <!-- BOX 2: Tiered Retrieval & Graph Traversal -->
  <g transform="translate(225, 60)" class="box-hover">
    <rect width="150" height="95" rx="8" fill="url(#boxBg)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="rgba(56, 189, 248, 0.2)" />
    <text x="24" y="28" text-anchor="middle" font-size="12">🕸️</text>
    <text x="42" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Selective Retrieval</text>
    <text x="42" y="37" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Layer 3 Graph</text>
    <line x1="12" y1="48" x2="138" y2="48" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="65" font-family="ui-monospace, monospace" font-size="9.5" fill="#f1f5f9">1-Hop Subgraphs</text>
    <text x="14" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#38bdf8">✓ Conflict Resolver</text>
  </g>

  <!-- BOX 3: Procedural & Skill Engine -->
  <g transform="translate(435, 60)" class="box-hover">
    <rect width="150" height="95" rx="8" fill="url(#boxBg)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="rgba(245, 158, 11, 0.2)" />
    <text x="24" y="28" text-anchor="middle" font-size="12">⚙️</text>
    <text x="42" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Procedural Engine</text>
    <text x="42" y="37" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Layer 5 Skills</text>
    <line x1="12" y1="48" x2="138" y2="48" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="65" font-family="ui-monospace, monospace" font-size="9.5" fill="#f1f5f9">How-To Stepper</text>
    <text x="14" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#f59e0b">✓ Live In-Chat Learn</text>
  </g>

  <!-- BOX 4: Episodic Logging & Empathy Response -->
  <g transform="translate(645, 60)" class="box-hover">
    <rect width="150" height="95" rx="8" fill="url(#boxBg)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="24" cy="24" r="10" fill="rgba(236, 72, 153, 0.2)" />
    <text x="24" y="28" text-anchor="middle" font-size="12">🤖</text>
    <text x="42" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ec4899">Response &amp; Episodic</text>
    <text x="42" y="37" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Layer 4 &amp; Actuators</text>
    <line x1="12" y1="48" x2="138" y2="48" stroke="rgba(255,255,255,0.08)" />
    <text x="14" y="65" font-family="ui-monospace, monospace" font-size="9.5" fill="#f1f5f9">Actionable Checklist</text>
    <text x="14" y="80" font-family="ui-monospace, monospace" font-size="8.5" fill="#a78bfa">✓ Episode Logged</text>
  </g>
</svg>

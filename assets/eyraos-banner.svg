<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="60%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Animated Shifting Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0">
        <animate attributeName="stop-color" values="#06d6a0;#38bdf8;#818cf8;#ec4899;#06d6a0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#ec4899;#06d6a0;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#ec4899;#06d6a0;#38bdf8;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="230" rx="8" fill="url(#bg)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="230"/>
    <line x1="180" y1="0" x2="180" y2="230"/>
    <line x1="320" y1="0" x2="320" y2="230"/>
    <line x1="560" y1="0" x2="560" y2="230"/>
    <line x1="720" y1="0" x2="720" y2="230"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
  </g>

  <!-- Left Accent Laser Bar -->
  <rect x="0" y="0" width="5" height="230" fill="url(#accent)"/>

  <!-- Scanning Laser Line (Glides down the banner) -->
  <line x1="5" y1="0" x2="895" y2="0" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5">
    <animate attributeName="y1" values="0;230;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;230;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- ======================================================== -->
  <!-- LEFT: ANIMATED HOLOGRAPHIC NEURAL GRAPH CORE             -->
  <!-- ======================================================== -->
  <g transform="translate(85, 115)">
    <!-- Ambient Halo Glow -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
      <animate attributeName="r" values="50;58;50" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer Fixed Track -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Outer Clockwise Rotating Orbit with Dashes & Satellite Node -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="14 10 24 10" opacity="0.75"/>
      <circle cx="0" cy="-45" r="4.5" fill="#38bdf8" filter="url(#coreGlow)"/>
      <circle cx="39" cy="22.5" r="4" fill="#a78bfa" filter="url(#coreGlow)"/>
      <circle cx="-39" cy="22.5" r="4" fill="#f59e0b" filter="url(#coreGlow)"/>
    </g>

    <!-- Middle Fixed Track -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Middle Counter-Clockwise Rotating Orbit -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#06d6a0" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.6"/>
      <circle cx="0" cy="28" r="3" fill="#06d6a0"/>
      <circle cx="-24" cy="-14" r="3" fill="#38bdf8"/>
    </g>

    <!-- Spokes connecting center to orbit -->
    <line x1="0" y1="-8" x2="0" y2="-40" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>
    <line x1="7" y1="4" x2="35" y2="20" stroke="#a78bfa" stroke-width="1" opacity="0.25"/>
    <line x1="-7" y1="4" x2="-35" y2="20" stroke="#f59e0b" stroke-width="1" opacity="0.25"/>

    <!-- Flowing Light Packets along Spokes -->
    <circle cx="0" cy="-20" r="2" fill="#fff">
      <animate attributeName="cy" values="-8;-40;-8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="12" r="2" fill="#fff">
      <animate attributeName="cx" values="7;35;7" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="4;20;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Core Neural Node Beacon (Pulsing size & opacity) -->
    <circle cx="0" cy="0" r="8" fill="#06d6a0" opacity="0.3" filter="url(#coreGlow)">
      <animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#06d6a0">
      <animate attributeName="r" values="7;8.5;7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER: TITLE BLOCK & ARCHITECTURAL SUMMARY              -->
  <!-- ======================================================== -->
  <text x="165" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
    EyraOS
  </text>
  <text x="165" y="102" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    Cognitive Memory Architecture for Intelligent Robotics
  </text>

  <!-- Subtle Accent Separator -->
  <line x1="165" y1="116" x2="520" y2="116" stroke="url(#accent)" stroke-width="1.2" opacity="0.4"/>

  <!-- Architectural Feature Badges -->
  <text x="165" y="142" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8">
    9-Layer Cognitive Hierarchy
  </text>
  <text x="165" y="162" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">
    Selective Retrieval  ·  Contradiction Engine  ·  Procedural Skills
  </text>
  <text x="165" y="182" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748b">
    Dual-Stream Session Lifecycle  ·  Autonomous Reflection
  </text>

  <!-- ======================================================== -->
  <!-- RIGHT: 4 ACTIVE ARCHITECTURE SUMMARY MODULE CARDS        -->
  <!-- ======================================================== -->
  <g transform="translate(540, 42)">
    <!-- Box 1: Semantic Graph -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="56" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="18" r="3.5" fill="#06d6a0">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#06d6a0">SEMANTIC GRAPH</text>
      <text x="14" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">1-Hop Subgraph Retrieval</text>
    </g>

    <!-- Box 2: Procedural Skills -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="165" height="56" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="18" r="3.5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">PROCEDURAL</text>
      <text x="14" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">How-To Skills Engine</text>
    </g>

    <!-- Box 3: Reflection -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="165" height="56" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="18" r="3.5" fill="#a78bfa">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">REFLECTION</text>
      <text x="14" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Autonomous Consolidation</text>
    </g>

    <!-- Box 4: Working Memory -->
    <g transform="translate(178, 68)">
      <rect x="0" y="0" width="165" height="56" rx="6" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="14" cy="18" r="3.5" fill="#f59e0b">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">WORKING MEM</text>
      <text x="14" y="40" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Session Decay &amp; Flush</text>
    </g>
  </g>

  <!-- Bottom Version Tag & Status -->
  <g transform="translate(540, 182)">
    <rect x="0" y="0" width="62" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="31" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#64748b">v1.0.0</text>

    <!-- Blinking Cursor Terminal Prompt -->
    <text x="75" y="14" font-family="ui-monospace, monospace" font-size="10.5" fill="#38bdf8">$ kernel.daemon --status: ACTIVE</text>
    <rect x="290" y="4" width="5" height="12" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

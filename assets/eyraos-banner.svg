<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="0" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="220" stroke="#fff" stroke-width="1" transform="translate(60,0)"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#fff" stroke-width="1" transform="translate(120,0)"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#fff" stroke-width="1" transform="translate(180,0)"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#fff" stroke-width="1" transform="translate(240,0)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,55)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,110)"/>
    <line x1="0" y1="0" x2="900" y2="0" stroke="#fff" stroke-width="1" transform="translate(0,165)"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="220" fill="url(#accent)"/>

  <!-- Core icon — simplified neural graph -->
  <g transform="translate(70, 110)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="12 8" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#accent2)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
    <!-- Core dot -->
    <circle cx="0" cy="0" r="7" fill="#06d6a0" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
    <!-- Nodes -->
    <circle cx="0" cy="-38" r="4" fill="#38bdf8"/>
    <circle cx="33" cy="19" r="4" fill="#a78bfa"/>
    <circle cx="-33" cy="19" r="4" fill="#f59e0b"/>
    <!-- Spokes -->
    <line x1="0" y1="-7" x2="0" y2="-34" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
    <line x1="6" y1="3" x2="29" y2="17" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
    <line x1="-6" y1="3" x2="-29" y2="17" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Title block -->
  <text x="140" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">EyraOS</text>
  <text x="140" y="108" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">Cognitive Memory Architecture for Intelligent Robotics</text>

  <!-- Separator line -->
  <line x1="140" y1="122" x2="520" y2="122" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <!-- Subtitle -->
  <text x="140" y="145" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">9-Layer Cognitive Hierarchy</text>
  <text x="140" y="164" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Selective Retrieval  ·  Contradiction Engine  ·  Procedural Skills</text>
  <text x="140" y="183" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Dual-Stream Session Lifecycle  ·  Autonomous Reflection</text>

  <!-- Right side — Architecture summary boxes -->
  <g transform="translate(560, 48)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="150" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#06d6a0">SEMANTIC GRAPH</text>
    <text x="12" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">Entity / Relation Store</text>

    <!-- Box 2 -->
    <rect x="164" y="0" width="150" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="176" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">PROCEDURAL</text>
    <text x="176" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">How-To Skills Engine</text>

    <!-- Box 3 -->
    <rect x="0" y="62" width="150" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa">REFLECTION</text>
    <text x="12" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">Consolidation Engine</text>

    <!-- Box 4 -->
    <rect x="164" y="62" width="150" height="50" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="176" y="84" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b">WORKING MEM</text>
    <text x="176" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#64748b">Session Decay / Flush</text>
  </g>

  <!-- Version tag -->
  <rect x="560" y="170" width="56" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="588" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#64748b">v1.0.0</text>
</svg>
